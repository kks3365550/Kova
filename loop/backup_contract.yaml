contract_version: "0.3"
objective: "BackupSystem Restore Verification Contract (Actual RestoreEngine Return Schema)"

acceptance_criteria:
  - id: "AC-RESTORE-01"
    description: "복원 요청된 유효 파일이 정상 추출되어야 함 (restored_files > 0)"
    required: true
  - id: "AC-RESTORE-02"
    description: "복원 실패 파일 목록이 비어 있어야 함 (failed_files == [])"
    required: true
  - id: "AC-RESTORE-03"
    description: "처리 항목 총합 불변식이 성립해야 함 (restored_files + skipped_files == total_files)"
    required: true

observe_tier: 2
