# pytest 설정 - 제품화 기준선
#
# 주의: pyflakes 는 표준 라이브러리만 사용하므로 pytest 와 무관하다.
# pytest 는 프로젝트 .venv 가 아니라 시스템 Python 에 설치되어 있다.
#
# benchmarks 디렉터리는 장시간 실행이므로 수집에서 제외한다.
# 운영 성능 수치는 tools/ 하위 스크립트로 별도 측정한다.

[pytest]
pythonpath = .
# benchmarks/ 는 장시간 실행 프로토타입 검증이라 전체 스위트에서 제외한다.
# 성능 수치는 tools/ 하위 스크립트로 별도 측정한다.
testpaths =
    tests
norecursedirs =
    tests/benchmarks
    .git
    .venv
    installer
    dist
    backup
    emergency_restore
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --tb=short -p no:cacheprovider
markers =
    slow: 장시간 실행 테스트 (전체 스위트에서 제외 권장)
    chaos: 파괴적 재해 시나리오
    integration: 외부 프로세스/네트워크 필요
