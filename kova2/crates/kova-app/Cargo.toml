[package]
name = "kova-app"
version = "3.1.2"
edition = "2021"

[dependencies]
slint = { version = "1.9", default-features = false, features = ["backend-winit", "renderer-femtovg", "compat-1-2"] }

tray-icon = { version = "0.19", default-features = false }
kova-ipc = { path = "../kova-ipc" }
kova-core = { path = "../kova-core" }
kova-image = { path = "../kova-image" }
kova-engine = { path = "../kova-engine" }
kova-service = { path = "../kova-service" }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[build-dependencies]
slint-build = "1.9"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
